services:
  db:
    image: postgres:16
    container_name: sovereign-db
    environment:
      POSTGRES_USER: sovereign
      POSTGRES_PASSWORD: sovereign
      POSTGRES_DB: sovereign
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "max_connections=100"]
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sovereign -d sovereign"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  dbdata:
